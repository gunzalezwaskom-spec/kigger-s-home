[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-organizer"
version = "1.0.0"
description = "安全、可预览、可撤销的本地文件整理与空间清理工具"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
smart-organizer = "smart_organizer.cli:main"
smart-organizer-gui = "smart_organizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

